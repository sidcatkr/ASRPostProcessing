asr_model: Qwen/Qwen3-ASR-1.7B
post_model: Qwen/Qwen3.5-9B
asr_backend: vllm_chat
post_backend: vllm_openai
asr_base_url: http://127.0.0.1:18000/v1
post_base_url: http://127.0.0.1:18001/v1
asr_base_urls:
  - http://127.0.0.1:18000/v1
  - http://127.0.0.1:18002/v1
post_base_urls:
  - http://127.0.0.1:18001/v1
  - http://127.0.0.1:18003/v1
stage_server_base_urls:
  - http://127.0.0.1:18000/v1
  - http://127.0.0.1:18001/v1
  - http://127.0.0.1:18002/v1
  - http://127.0.0.1:18003/v1
stage_server_gpus:
  - "0"
  - "1"
  - "2"
  - "3"
preprocess_gpus:
  - "0"
  - "1"
  - "2"
  - "3"
pipeline_lanes:
  - name: lane_a
    asr_base_url: http://127.0.0.1:18000/v1
    post_base_url: http://127.0.0.1:18001/v1
    preprocess_gpu: "1"
    asr_server_gpu: "0"
    post_server_gpu: "1"
  - name: lane_b
    asr_base_url: http://127.0.0.1:18002/v1
    post_base_url: http://127.0.0.1:18003/v1
    preprocess_gpu: "3"
    asr_server_gpu: "2"
    post_server_gpu: "3"
request_timeout_s: 180
asr_request_timeout_s: 600
asr_chunking_strategy: silence
asr_chunk_seconds: 120
asr_chunk_padding_seconds: 0.5
asr_silence_threshold_db: -35
asr_min_silence_seconds: 0.6
asr_context_chars: 0
asr_chunk_parallelism: 4
auto_start_model_servers: true
model_residency: stage_replicas
server_start_timeout_s: 1200
server_shutdown_timeout_s: 45
server_log_dir: outputs/model_servers_l4x4
asr_server_gpu: "0"
post_server_gpu: "1"
asr_server_host: 0.0.0.0
post_server_host: 0.0.0.0
server_gpu_memory_utilization: auto
server_gpu_memory_utilization_max: 0.99
server_gpu_memory_reserved_mb: 0
asr_server_command: >-
  exec {python} -m asrpostprocessing.qwen_asr_serve_compat {model}
  --host {host}
  --port {port}
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-model-len 65536
post_server_command: >-
  exec {vllm} serve {model}
  --host {host}
  --port {port}
  --dtype bfloat16
  --max-model-len 8192
  --language-model-only
  --gpu-memory-utilization {gpu_memory_utilization}
  --max-num-seqs 16
  --max-num-batched-tokens 32768
postprocess_parallelism: 16
sweep_parallelism: 2
sweep_saturate_lanes: true
auto_experiment_parallelism: 16
auto_experiment_saturate_lanes: true
auto_experiment_coverage: full_strength_sweep
auto_experiment_include_models: false
auto_experiment_asr_models:
  - Qwen/Qwen3-ASR-1.7B
auto_experiment_post_models:
  - Qwen/Qwen3.5-9B
auto_experiment_noise_models:
  - afftdn
  - rnnoise
  - deepfilternet2
  - deepfilternet2_pf
  - deepfilternet3
  - bs-roformer
auto_experiment_rag_embedding_models:
  - intfloat/multilingual-e5-base
  - BAAI/bge-m3
auto_experiment_keyword_weights:
  - 0.5
  - 1.0
auto_experiment_noise_strengths:
  - 0.5
  - 1.0
auto_experiment_volume_strengths:
  - 0.5
  - 1.0
auto_experiment_postprocess_strengths:
  - 0.5
  - 1.0
auto_experiment_rag_strengths:
  - 0.5
  - 1.0
auto_experiment_rag_top_ks:
  - 4
  - 8
  - 12
auto_experiment_search_strengths:
  - 0.5
  - 1.0
asr_cache_enabled: true
preprocess_cache_enabled: true
cache_dir: outputs/cache
upload_cache_enabled: true
upload_cache_dir: outputs/upload_cache
enable_preprocess: false
preprocess_model: none
preprocess_strength: 0.0
preprocess_gpu: "0"
enable_noise_reduction: true
noise_reduction_model: deepfilternet2
noise_reduction_command: ""
noise_reduction_strength: 1.0
enable_volume_normalization: true
volume_normalization_strength: 1.0
volume_target_dbfs: -20.0
enable_keyword_bias: true
keyword_bias_weight: 1.0
keywords: []
enable_llm_postprocess: true
postprocess_strength: 1.0
enable_rag: true
rag_strength: 1.0
rag_top_k: 8
rag_embedding_backend: faiss
rag_embedding_model: intfloat/multilingual-e5-base
enable_search: true
search_strength: 1.0
search_provider: duckduckgo
search_cache_dir: outputs/search_cache
search_endpoint: ""
output_dir: outputs
runs_dir: runs
tensorboard_port: 6006
