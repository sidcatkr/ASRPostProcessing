asr_model: Qwen/Qwen3-ASR-1.7B
post_model: Qwen/Qwen3.5-9B
asr_backend: vllm_chat
post_backend: vllm_openai
asr_base_url: http://127.0.0.1:18000/v1
post_base_url: http://127.0.0.1:18001/v1
request_timeout_s: 120
asr_request_timeout_s: 300
asr_chunking_strategy: silence
asr_chunk_seconds: 120
asr_chunk_padding_seconds: 0.5
asr_silence_threshold_db: -35
asr_min_silence_seconds: 0.6
asr_context_chars: 240
auto_start_model_servers: true
model_residency: parallel
server_start_timeout_s: 900
server_shutdown_timeout_s: 30
server_log_dir: outputs/model_servers
asr_server_gpu: "0"
post_server_gpu: "1"
asr_server_host: 0.0.0.0
post_server_host: 0.0.0.0
asr_server_command: ""
post_server_command: ""
enable_preprocess: false
preprocess_model: none
preprocess_strength: 0.0
enable_noise_reduction: false
noise_reduction_model: none
noise_reduction_strength: 0.0
enable_volume_normalization: false
volume_normalization_strength: 0.0
volume_target_dbfs: -20.0
enable_keyword_bias: true
keyword_bias_weight: 0.5
keywords: []
enable_llm_postprocess: true
postprocess_strength: 0.5
enable_selective_correction: true
selective_min_confidence: null
selective_max_edit_ratio: 0.20
selective_max_edits_per_100_chars: 2
enable_rag: false
rag_strength: 0.0
rag_top_k: 5
rag_embedding_backend: faiss
rag_embedding_model: BAAI/bge-m3
enable_search: false
search_strength: 0.0
search_provider: duckduckgo
search_cache_dir: outputs/search_cache
search_endpoint: ""
output_dir: outputs
runs_dir: runs
tensorboard_port: 6006
